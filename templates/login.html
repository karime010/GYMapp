{% extends "base.html" %}
{% block contenido %}
<div class="container  justify-content-center align-items-center min-vh-100 d-flex" style="background: linear-gradient(to bottom, #fff, #ff6 )">
    <div class="card shadow p-4" style="width: 400px;">
        <div class="text-center" >
            <h1 class="mb-4"><strong>Inicia sesion</strong></h1>
            <img src="static/OIP.webp" class="rounded" alt="imagen de logotipo de persona">
        </div>
        {% if error %}
        <p style="color:red;">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/login">
            <input type="email" name="email" class="form-control mb-3" placeholder="Correo" required>

            <input type="password" name="password" class="form-control mb-3" placeholder="Contraseña" required>
            
            <button type="submit" class="btn btn-primary w-100">Iniciar sesion</button><br><br>
            <a href="/registro" class="btn btn-dark w-100">Aun no tienes una cuenta?</a><br><br>
            <a href="/recuperar" class="btn btn-link w-100">Olvidaste tu contraseña?</a>
        </form>
    </div>
</div>

{% endblock %}
